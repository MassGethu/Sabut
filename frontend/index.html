<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f4ef" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Sabūt · Rice claim review</title>
    <style>
      /* Startup splash: inline so it paints before the app bundle loads; pure CSS so it always clears. */
      #splash {
        --splash-bg: #1f5f3f;
        --splash-gold: #e8d27a;
        position: fixed; inset: 0; z-index: 9999;
        display: grid; place-items: center;
        background: var(--splash-bg);
        animation: splash-out 420ms cubic-bezier(0.4, 0, 0.2, 1) 1500ms forwards;
        cursor: pointer;
      }
      #splash::before {
        /* Soft radial light behind the mark gives the flat fill some depth. */
        content: ""; position: absolute; inset: 0;
        background: radial-gradient(circle at 50% 46%, rgba(232, 210, 122, 0.14), transparent 42%);
        opacity: 0; animation: splash-glow 900ms ease-out 150ms forwards;
      }
      .splash-mark {
        position: relative; display: grid; justify-items: center; gap: 18px;
        animation: splash-mark-out 360ms cubic-bezier(0.4, 0, 1, 1) 1240ms forwards;
      }
      .splash-mark svg { width: 112px; height: 112px; overflow: visible; }
      .splash-stalk {
        fill: none; stroke: var(--splash-gold); stroke-width: 2.4; stroke-linecap: round;
        stroke-dasharray: 40; stroke-dashoffset: 40;
        animation: splash-draw 760ms cubic-bezier(0.65, 0, 0.35, 1) 120ms forwards;
      }
      .splash-grain {
        fill: var(--splash-gold); transform-origin: 22px 22px; transform: scale(0);
        animation: splash-pop 420ms cubic-bezier(0.16, 1, 0.3, 1) 680ms forwards;
      }
      .splash-word {
        margin: 0; color: #fbf8ec;
        font: 700 34px/1 "Noto Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: 0.04em;
        opacity: 0; transform: translateY(8px);
        animation: splash-rise 520ms cubic-bezier(0.16, 1, 0.3, 1) 720ms forwards;
      }
      .splash-tag {
        margin: -8px 0 0; color: rgba(251, 248, 236, 0.62);
        font: 500 13px/1.4 "Noto Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: 0.08em; text-transform: uppercase;
        opacity: 0; transform: translateY(6px);
        animation: splash-rise 520ms cubic-bezier(0.16, 1, 0.3, 1) 840ms forwards;
      }
      #splash.skip { animation: splash-skip 220ms ease-out forwards; }
      #splash.skip .splash-mark { animation: splash-mark-skip 160ms ease-in forwards; }

      @keyframes splash-draw { to { stroke-dashoffset: 0; } }
      @keyframes splash-pop { to { transform: scale(1); } }
      @keyframes splash-rise { to { opacity: 1; transform: none; } }
      @keyframes splash-glow { to { opacity: 1; } }
      @keyframes splash-mark-out { to { opacity: 0; transform: scale(0.94); filter: blur(4px); } }
      @keyframes splash-out { to { opacity: 0; visibility: hidden; pointer-events: none; } }
      /* Separate names so a skip restarts the exit instead of retiming the running one. */
      @keyframes splash-skip { to { opacity: 0; visibility: hidden; pointer-events: none; } }
      @keyframes splash-mark-skip { to { opacity: 0; transform: scale(0.94); filter: blur(4px); } }

      @media (prefers-reduced-motion: reduce) {
        /* No drawing or movement: the finished mark fades in, holds, and fades out. */
        .splash-stalk { stroke-dashoffset: 0; animation: none; }
        .splash-grain { transform: none; animation: none; }
        .splash-word, .splash-tag { transform: none; animation: splash-rise 300ms ease-out forwards; }
        .splash-mark { animation: splash-fade 300ms ease-in 900ms forwards; }
        #splash { animation: splash-out 300ms ease-out 1000ms forwards; }
        #splash::before { animation: none; opacity: 1; }
        @keyframes splash-fade { to { opacity: 0; } }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" aria-hidden="true">
      <div class="splash-mark">
        <svg viewBox="4 4 24 24">
          <path class="splash-stalk" pathLength="40" d="M8 22c6-1 10-6 12-14 1 7-2 13-8 15" />
          <circle class="splash-grain" cx="22" cy="22" r="3" />
        </svg>
        <p class="splash-word">Sabūt</p>
        <p class="splash-tag">Rice claim review</p>
      </div>
    </div>
    <script>
      // Click or any key skips the splash; remove it from the DOM once it has faded.
      (function () {
        var el = document.getElementById("splash");
        if (!el) return;
        var skip = function () { el.classList.add("skip"); };
        el.addEventListener("click", skip);
        window.addEventListener("keydown", skip, { once: true });
        var done = function () {
          window.removeEventListener("keydown", skip);
          el.remove();
        };
        el.addEventListener("animationend", function (e) {
          if (e.target === el && /^splash-(out|skip)$/.test(e.animationName)) done();
        });
        // Failsafe: if animations never run (throttled or hidden page), never leave the app covered.
        setTimeout(done, 4000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
